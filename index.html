<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Without this, phones draw the page at desktop size and everything looks tiny -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPR Coach</title>
  <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
  <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="demos" class="invisible">

    <div id="liveView" class="camera">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="output_canvas" class="output_canvas"></canvas>
      <button id="webcamButton" class="mdc-button mdc-button--raised">
        <span class="mdc-button__ripple"></span>
        <span class="mdc-button__label">ENABLE WEBCAM</span>
      </button>
    </div>


    <div id="dashboard">
      <div class="stats">
        <div class="stat"><span class="label">Compressions</span><span id="compressionCount" class="value">0</span></div>
        <div class="stat"><span class="label">Rate /min</span><span id="compressionRate" class="value">--</span></div>
        <div class="stat"><span class="label">Feedback</span><span id="rateFeedback" class="value small">Waiting...</span></div>
      </div>
      <p id="breathReminder">30 compressions until the next cycle.</p>
      <canvas id="wristGraph" width="640" height="140"></canvas>
      <div class="dash-footer">
        <span><b class="blue">■</b> Wrist 15 &nbsp;<b class="orange">■</b> Wrist 16</span>
        <button id="uploadToggle" type="button">Upload video</button>
      </div>
    </div>

    <div id="uploadPanel" hidden>
      <input type="file" id="videoFile" accept="video/*">
      <div id="uploadedVideoContainer">
        <video id="uploadedVideo" autoplay playsinline controls></video>
        <canvas id="videoCanvas"></canvas>
      </div>
    </div>
  </section>

  <audio id="metronome" src="metronome.mp3" loop preload="auto"></audio>
  <audio id="compressionReminder" src="reminder.mp3" preload="auto"></audio>
  <script type="module" src="script.js"></script>
</body>
</html>
